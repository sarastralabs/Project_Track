services:
  mongo:
    image: mongo:7
    container_name: sarastra-mongo
    restart: unless-stopped
    ports:
      # Host 28018 → container 27017 (avoids clash with Gisul Mongo on 27017)
      - "28018:27017"
    volumes:
      - sarastra_mongo_data:/data/db
    # Replica set required for multi-document transactions (used later in the API).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  sarastra_mongo_data:
